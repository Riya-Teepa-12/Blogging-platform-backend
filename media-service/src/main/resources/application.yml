server:
  port: 8085

spring:
  application:
    name: media-service
  datasource:
    url: ${MEDIA_DB_URL:jdbc:h2:file:./data/mediadb;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${MEDIA_DB_USERNAME:sa}
    password: ${MEDIA_DB_PASSWORD:}
    driver-class-name: ${MEDIA_DB_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${MEDIA_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: false

inkwell:
  media:
    base-url: https://cdn.inkwell.local/media
